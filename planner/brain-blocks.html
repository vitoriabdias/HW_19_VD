<title>Brain Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@300;400;500;600&display=swap">
<style>
/* Layout: one calm column (max 980px). Home = a grid of five colour-coded blocks; each block opens its own view. Bottom tab bar for thumbs. */
:root {
  --bg: #F5F3FC;
  --surface: #FFFFFF;
  --surface-2: #FBFAFF;
  --ink: #29233F;
  --muted: #6B6585;
  --line: #E5E1F2;
  --shadow: 0 1px 2px rgba(60, 45, 120, .06), 0 6px 18px rgba(60, 45, 120, .07);

  --tasks: #7B6CF0;   --tasks-soft: #ECE9FE;   --tasks-deep: #4A3BC0;
  --grocery: #2BAE7A; --grocery-soft: #DCF4E9; --grocery-deep: #17704C;
  --clean: #F0AE34;   --clean-soft: #FFF0D0;   --clean-deep: #8A5A00;
  --money: #2D98C8;   --money-soft: #DBEFF8;   --money-deep: #145F82;
  --care: #EE6799;    --care-soft: #FDE3ED;    --care-deep: #A3285A;

  --ok: #2BAE7A; --ok-soft: #DCF4E9;
  --warn: #E59A1A; --warn-soft: #FFF0D0;
  --hot: #E5486E; --hot-soft: #FDE1E8;

  --f-display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;

  --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
  --tab-h: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16132A; --surface: #211D37; --surface-2: #1C1930; --ink: #F1EEFB; --muted: #A9A3C6; --line: #352F52;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    --tasks-soft: #2C2754; --tasks-deep: #BDB4FF;
    --grocery-soft: #163A2D; --grocery-deep: #82E2B8;
    --clean-soft: #3D3016; --clean-deep: #FFD47D;
    --money-soft: #15344A; --money-deep: #93D5F3;
    --care-soft: #43203A; --care-deep: #FFA3C6;
    --ok-soft: #163A2D; --warn-soft: #3D3016; --hot-soft: #45202C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16132A; --surface: #211D37; --surface-2: #1C1930; --ink: #F1EEFB; --muted: #A9A3C6; --line: #352F52;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --tasks-soft: #2C2754; --tasks-deep: #BDB4FF;
  --grocery-soft: #163A2D; --grocery-deep: #82E2B8;
  --clean-soft: #3D3016; --clean-deep: #FFD47D;
  --money-soft: #15344A; --money-deep: #93D5F3;
  --care-soft: #43203A; --care-deep: #FFA3C6;
  --ok-soft: #163A2D; --warn-soft: #3D3016; --hot-soft: #45202C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tasks); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }

.b-tasks   { --c: var(--tasks);   --c-soft: var(--tasks-soft);   --c-deep: var(--tasks-deep); }
.b-grocery { --c: var(--grocery); --c-soft: var(--grocery-soft); --c-deep: var(--grocery-deep); }
.b-clean   { --c: var(--clean);   --c-soft: var(--clean-soft);   --c-deep: var(--clean-deep); }
.b-money   { --c: var(--money);   --c-soft: var(--money-soft);   --c-deep: var(--money-deep); }
.b-care    { --c: var(--care);    --c-soft: var(--care-soft);    --c-deep: var(--care-deep); }

.wrap { max-width: 980px; margin: 0 auto; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand-mark { width: 38px; height: 38px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.brand-mark i { border-radius: 7px; display: block; }
.brand-mark i:nth-child(1) { background: var(--tasks); border-radius: 10px 6px 6px 6px; }
.brand-mark i:nth-child(2) { background: var(--grocery); border-radius: 50%; }
.brand-mark i:nth-child(3) { background: var(--care); border-radius: 50%; }
.brand-mark i:nth-child(4) { background: var(--clean); border-radius: 6px 6px 10px 6px; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; }
.top-right { display: flex; align-items: center; gap: 8px; }
.sync { font-size: .78rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="cloud"]::before { background: var(--ok); }
.sync[data-s="saving"]::before { background: var(--warn); }
.sync[data-s="error"]::before, .sync[data-s="unreachable"]::before { background: var(--hot); }
.icon-btn { width: 40px; height: 40px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1.1rem; }

/* Views */
.view { display: flex; flex-direction: column; gap: 18px; padding-block: 10px 0; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.view-head h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
.view-head p { margin: 4px 0 0; color: var(--muted); }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--c-deep, var(--muted)); }

/* Example banner */
.examples { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--r-md); padding: 10px 14px; font-size: .9rem; color: var(--muted); }
.examples strong { color: var(--ink); font-weight: 500; }

/* Home */
.hello h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); }
.hello p { margin: 6px 0 0; color: var(--muted); font-size: 1.02rem; }
.today-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--c-soft, var(--surface)); color: var(--c-deep, var(--ink)); font-size: .88rem; font-weight: 500; border: 0; text-decoration: none; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; overflow: hidden; text-align: left; border: 0; border-radius: var(--r-lg); padding: 18px 18px 16px; background: var(--c-soft); color: var(--ink); display: flex; flex-direction: column; gap: 6px; min-height: 168px; text-decoration: none; transition: transform .15s ease; }
.tile:hover { transform: translateY(-2px); }
.tile:active { transform: scale(.98); }
.tile.span2 { grid-column: span 2; }
.tile-blob { position: absolute; right: -26px; top: -26px; width: 120px; height: 120px; background: var(--c); opacity: .2; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
.tile-icon { width: 46px; height: 46px; border-radius: 15px; background: var(--c); display: grid; place-items: center; font-size: 1.4rem; position: relative; }
.tile h2 { font-size: 1.25rem; color: var(--c-deep); position: relative; margin-top: 6px; }
.tile .big { font-family: var(--f-display); font-size: 2rem; font-weight: 600; line-height: 1; margin-top: auto; font-variant-numeric: tabular-nums; }
.tile .big small { font-size: .95rem; font-weight: 500; color: var(--muted); margin-left: 4px; font-family: var(--f-body); }
.tile .sub { font-size: .86rem; color: var(--muted); }
.tile-peek { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: relative; }
.tile-peek li { font-size: .9rem; background: var(--surface); border-radius: 10px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.tile-peek li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.one-thing-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border-radius: var(--r-lg); border: 0; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; }
.one-thing-btn:hover { filter: brightness(1.1); }

/* Focus card */
.focus { background: var(--surface); border: 3px solid var(--tasks); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.focus .kicker { color: var(--tasks-deep); }
.focus .focus-text { font-family: var(--f-display); font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
.focus-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--c, var(--tasks)); color: #fff; font-weight: 500; white-space: nowrap; }
.b-clean .btn, .btn.on-clean { color: #3A2600; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.soft { background: var(--c-soft); color: var(--c-deep); }
.btn.danger { background: var(--hot-soft); color: var(--hot); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: .86rem; }
.link-btn { background: none; border: 0; padding: 4px 6px; color: var(--c-deep, var(--muted)); font-weight: 500; font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }

/* Add bar */
.addbar { background: var(--surface); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--c-soft); }
.add-row { display: flex; gap: 8px; }
.add-row input[type="text"], .add-row input[type="number"] { flex: 1; min-width: 0; height: 50px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface-2); padding: 0 16px; font-size: 1.02rem; }
.add-row input:focus { border-color: var(--c); outline: none; }
.add-row .btn { height: 50px; border-radius: 16px; font-size: 1.02rem; padding: 0 20px; }
.add-opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add-opts .lbl { font-size: .8rem; color: var(--muted); }
.hint { font-size: .82rem; color: var(--muted); }

/* Segmented + chips */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: .86rem; color: var(--muted); font-weight: 500; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--c, var(--tasks)); color: #fff; }
.b-clean .seg button[aria-pressed="true"] { color: #3A2600; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: none; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: .9rem; font-weight: 500; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--c); background: var(--c-soft); color: var(--c-deep); }
.chip .n { font-size: .75rem; background: var(--bg); border-radius: 999px; padding: 1px 7px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .n { background: var(--surface); color: var(--c-deep); }
.chip.hot[aria-pressed="true"] { border-color: var(--hot); background: var(--hot-soft); color: var(--hot); }
select.chip-select { appearance: none; -webkit-appearance: none; border: 2px solid var(--c-soft); background: var(--c-soft); color: var(--c-deep); border-radius: 999px; padding: 6px 30px 6px 12px; font-size: .88rem; font-weight: 500; min-height: 36px; max-width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.toggle { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 500; min-height: 36px; color: var(--muted); }
.toggle[aria-pressed="true"] { background: var(--hot-soft); border-color: var(--hot); color: var(--hot); }

.controls { display: flex; flex-direction: column; gap: 10px; }
.controls-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* Lists */
.group { display: flex; flex-direction: column; gap: 8px; }
.group-head { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; padding: 0 4px; }
.group-head .count { font-family: var(--f-body); font-size: .78rem; color: var(--muted); font-weight: 400; background: var(--surface); border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--r-md); padding: 10px 10px 10px 12px; box-shadow: var(--shadow); min-height: 60px; }
.item.urgent { box-shadow: var(--shadow), inset 0 0 0 2px var(--hot); }
.item.done { opacity: .6; box-shadow: none; background: var(--surface-2); }
.item.done .item-text { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--muted); }
.check { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--c, var(--tasks)); background: transparent; display: grid; place-items: center; transition: transform .15s ease, background .15s ease; padding: 0; }
.check:hover { background: var(--c-soft); }
.check:active { transform: scale(.85); }
.check svg { width: 18px; height: 18px; opacity: 0; }
.done .check, .check[aria-checked="true"] { background: var(--c); }
.done .check svg, .check[aria-checked="true"] svg { opacity: 1; }
.check svg path { stroke: #fff; }
.b-clean .check svg path { stroke: #3A2600; }
.item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; background: none; border: 0; text-align: left; padding: 2px 0; }
.item-text { font-size: 1rem; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .74rem; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--c-soft); color: var(--c-deep); white-space: nowrap; }
.tag.hot { background: var(--hot-soft); color: var(--hot); }
.tag.warn { background: var(--warn-soft); color: var(--clean-deep); }
.tag.ok { background: var(--ok-soft); color: var(--grocery-deep); }
.tag.plain { background: var(--bg); color: var(--muted); }
.more { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-size: 1.2rem; display: grid; place-items: center; }
.more:hover { background: var(--bg); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); background: var(--surface); border-radius: var(--r-lg); border: 2px dashed var(--line); }
.empty .em-big { font-size: 2rem; display: block; margin-bottom: 4px; }
details.done-box { background: transparent; }
details.done-box summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 4px; color: var(--muted); font-weight: 500; }
details.done-box summary::-webkit-details-marker { display: none; }
details.done-box summary .caret { display: inline-block; transition: transform .15s; }
details.done-box[open] summary .caret { transform: rotate(90deg); }
details.done-box .list { margin-top: 6px; }

/* Rooms */
.rooms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.room { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.room-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.room-head h3 { font-size: 1.1rem; display: flex; gap: 8px; align-items: center; }
.bar { height: 10px; border-radius: 999px; background: var(--c-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--c); transition: width .4s ease; }
.progress-card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.progress-card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.progress-card .pct { font-family: var(--f-display); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Money */
.money-top { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border-radius: var(--r-md); padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat.hero { background: var(--money-soft); box-shadow: none; }
.stat .lbl { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.stat .val { font-family: var(--f-display); font-weight: 600; font-size: 1.45rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat.hero .val { font-size: 1.9rem; color: var(--money-deep); }
.stat .val.pos { color: var(--grocery-deep); }
.stat .val.neg { color: var(--hot); }
.month-nav { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.month-nav button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--bg); font-size: 1rem; }
.month-nav span { font-family: var(--f-display); font-weight: 600; min-width: 128px; text-align: center; }
.money-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { font-size: 1.1rem; }
.amt { font-family: var(--f-display); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--grocery-deep); }
.amt.out { color: var(--ink); }
.cat-bars { display: flex; flex-direction: column; gap: 10px; }
.cat-bar .row { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.cat-bar .row .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.cat-bar .track { height: 12px; margin-top: 4px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.cat-bar .track i { display: block; height: 100%; background: var(--money); border-radius: 0 4px 4px 0; min-width: 4px; }
.day-label { font-size: .8rem; color: var(--muted); font-weight: 500; padding: 4px 4px 0; }
.money-add { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; }
.money-add input { height: 50px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface-2); padding: 0 14px; min-width: 0; width: 100%; font-size: 1rem; }
.money-add input:focus { border-color: var(--money); outline: none; }

/* Care */
.care-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.care-card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.care-card .care-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.care-emoji { width: 48px; height: 48px; border-radius: 50% 50% 50% 14px; background: var(--care-soft); display: grid; place-items: center; font-size: 1.5rem; flex: none; }
.care-card h3 { font-size: 1.08rem; overflow-wrap: anywhere; }
.care-card .when { font-size: .84rem; color: var(--muted); }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); display: block; }
.dots i.on { background: var(--care); border-color: var(--care); }
.dots .dl { font-size: .72rem; color: var(--muted); margin-left: 4px; }
.status { font-size: .76rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.status.fresh { background: var(--ok-soft); color: var(--grocery-deep); }
.status.soon { background: var(--warn-soft); color: var(--clean-deep); }
.status.due { background: var(--hot-soft); color: var(--hot); }
.did-btn { margin-top: auto; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;

const BLANK = { tasks: () => ({ items: [] }), grocery: () => ({ items: [] }), clean: () => ({ items: [] }), money: () => ({ start: 0, entries: [] }), care: () => ({ items: [] }) };
function normalize(k, d) {

/* ---------- state + persistence ---------- */
const KEYS = ['tasks', 'grocery', 'clean', 'money', 'care'];
const LSP = 'brainblocks.v1.';
const lsGet = k => { try { const v = localStorage.getItem(LSP + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(LSP + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } };
const S = {};
KEYS.forEach(k => { const v = lsGet(k); S[k] = v ? normalize(k, v) : examples(k); });

const R = { db: null, uid: null, refs: {}, answered: {}, dirty: {}, writing: {}, again: {}, timers: {}, preConnect: {} };
let syncState = 'local';
function setSync(s) {
  syncState = s;
  const el = $('#sync');
  const text = { local: 'Saved on this device', loading: 'Loading your stuff…', cloud: 'Saved ✓', saving: 'Saving…', error: 'Not saved yet, will retry', unreachable: "Can't reach your saved data yet" }[s] || '';
  el.dataset.s = s; el.textContent = text;
}

function save(k) {
  lsSet(k, S[k]);
  if (!R.refs[k]) { R.preConnect[k] = true; return; }
  R.dirty[k] = true;
  setSync('saving');
  clearTimeout(R.timers[k]);
  R.timers[k] = setTimeout(() => flush(k), 600);
}
async function flush(k) {
  if (R.writing[k]) { R.again[k] = true; return; }
  R.writing[k] = true; R.dirty[k] = false;
  try {
    await R.refs[k].set(JSON.parse(JSON.stringify(S[k])));
    if (!Object.values(R.dirty).some(Boolean)) setSync('cloud');
  } catch (e) {
    R.dirty[k] = true; setSync('error');
    clearTimeout(R.timers[k]); R.timers[k] = setTimeout(() => flush(k), 8000);
  }
  R.writing[k] = false;
  if (R.again[k]) { R.again[k] = false; flush(k); }
}

async function connect() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    R.db = db; R.uid = id;
    setSync('loading');
    const timer = setTimeout(() => { if (!KEYS.every(k => R.answered[k])) setSync('unreachable'); }, 10000);
    KEYS.forEach(k => {
      const ref = db.collection('data/users/' + id).doc(k);
      R.refs[k] = ref;
      ref.onSnapshot(snap => {
        const meta = snap.metadata || {};
        const first = !R.answered[k] && !meta.fromCache;
        if (!meta.fromCache) R.answered[k] = true;
        if (KEYS.every(x => R.answered[x])) { clearTimeout(timer); if (syncState === 'loading' || syncState === 'unreachable') setSync('cloud'); }
        if (meta.hasPendingWrites || R.dirty[k] || R.writing[k]) return;
        if (snap.exists) {
          S[k] = normalize(k, snap.data());
          lsSet(k, S[k]);
          render();
        } else if (first && R.preConnect[k]) {
          // Edits made before the account store answered: save them now that we know nothing is stored yet.
          R.preConnect[k] = false;
          setTimeout(() => save(k), 0);
        }
      }, () => { clearTimeout(timer); setSync('error'); });
    });
  } catch (e) { /* stays on this device */ }
}

const WHEN = [{ id: 'today', label: 'Today' }, { id: 'week', label: 'This week' }, { id: 'month', label: 'This month' }, { id: 'someday', label: 'Someday' }];
const whenRank = { today: 0, week: 1, month: 2, someday: 3 };
function inWhen(t, f) {
  if (f === 'all') return true;
  if (f === 'someday') return t.when === 'someday';
  const lim = whenRank[f];

const cleanDone = c => {

const careLast = c => (c.log || []).slice().sort().pop() || null;

  if (n < c.every * 0.7) return { id: 'fresh', label: 'Fresh' };
  if (n < c.every) return { id: 'soon', label: 'Soon' };
  return { id: 'due', label: 'Due' };
}

function pickOne() {
  const open = S.tasks.items.filter(t => !t.done);
  if (!open.length) return null;
  const score = t => (t.urgent ? 4 : 0) + (3 - whenRank[t.when]);
  const top = Math.max(...open.map(score));
  const pool = open.filter(t => score(t) === top && t.id !== UI.focus);
  const p = pool.length ? pool : open.filter(t => score(t) === top);
  return p[Math.floor(Math.random() * p.length)].id;
}

function saveEdit() {
  const { k, id } = sheetCtx;
  const item = listOf(k).find(x => x.id === id);
  if (!item) return closeSheet();
  const v = s => ($('#' + s, sheet) || {}).value;
  const text = (v('e_text') || '').trim();
  if (!text) { $('#e_text', sheet).focus(); return; }
  if (k === 'money') { item.desc = text; item.amount = Math.abs(parseFloat(v('e_amt')) || 0); item.dir = v('e_dir'); item.cat = v('e_cat'); item.date = v('e_date') || today(); }
  else item.text = text;
  if (k === 'tasks') { item.cat = v('e_cat'); item.when = v('e_when'); item.urgent = v('e_urgent') === '1'; }
  if (k === 'grocery') { item.qty = (v('e_qty') || '').trim(); item.aisle = v('e_aisle'); item.store = v('e_store'); }
  if (k === 'clean') { item.room = v('e_room'); item.freq = v('e_freq'); }
  if (k === 'care') { item.kind = v('e_kind'); item.every = Number(v('e_every')) || 7; if (item.e && !CARE_IDEAS.some(i => i.text === item.text)) delete item.e; }
  delete item.ex;
  save(k); closeSheet(); render(); toast('Saved');
}
let lastDeleted = null;
function deleteItem(k, id) {
  const list = listOf(k);
  const i = list.findIndex(x => x.id === id);
  if (i < 0) return;
  const [item] = list.splice(i, 1);
  lastDeleted = { k, item, i };
  save(k); render();
  toast('Deleted', 'Undo', () => { if (!lastDeleted) return; listOf(lastDeleted.k).splice(lastDeleted.i, 0, lastDeleted.item); save(lastDeleted.k); lastDeleted = null; render(); });
}

async function exportData() {
  const data = JSON.stringify({ app: 'brain-blocks', version: 1, exported: new Date().toISOString(), ...Object.fromEntries(KEYS.map(k => [k, S[k]])) }, null, 2);
  const filename = `brain-blocks-backup-${today()}.json`;
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data }); toast('Backup saved'); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    toast('Backup saved');
  } catch (e) { toast("Couldn't save the file here"); }
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== 'brain-blocks') throw new Error('not ours');
      KEYS.forEach(k => { if (d[k]) { S[k] = normalize(k, d[k]); save(k); } });
      closeSheet(); render(); toast('Backup restored');
    } catch (e) { toast("That file isn't a Brain Blocks backup"); }
  };
  r.readAsText(file);
}

/* ---------- toast + confetti ---------- */
let toastTimer;
function toast(msg, actionLabel, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
  t.hidden = false;
  if (actionLabel) t.querySelector('button').onclick = () => { action(); t.hidden = true; };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, actionLabel ? 6000 : 2200);
}
const CHEERS = ['Nice one! 🎉', 'Look at you go! ✨', 'One down! 💪', 'Your brain says thanks 🧠', 'Tiny win, big deal 🌟', 'Yesss! 🙌', 'Proud of you 💖'];
const cheer = () => CHEERS[Math.floor(Math.random() * CHEERS.length)];
function confetti(el) {
  if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect();
  const colors = ['var(--tasks)', 'var(--grocery)', 'var(--clean)', 'var(--money)', 'var(--care)'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('span');
    p.className = 'pop';
    const ang = (Math.PI * 2 * i) / 12, dist = 30 + Math.random() * 30;
    p.style.left = r.left + r.width / 2 - 5 + 'px'; p.style.top = r.top + r.height / 2 - 5 + 'px';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 750);
  }
}

/* ---------- actions ---------- */
function clearExamples() {
  KEYS.forEach(k => {
    const before = listOf(k).length;
    if (k === 'money') { S.money.entries = S.money.entries.filter(e => !e.ex); if (S.money.entries.length !== before || S.money.start === 1200) { if (S.money.start === 1200 && !S.money.entries.length) S.money.start = 0; save(k); } }
    else { S[k].items = S[k].items.filter(i => !i.ex); if (S[k].items.length !== before) save(k); }
  });
  UI.focus = null; render(); toast('Fresh start ✨');
}
function toggle(k, id, btn) {
  const item = listOf(k).find(x => x.id === id);
  if (!item) return;
  let nowDone = false;
  if (k === 'tasks') { item.done = !item.done; item.doneAt = item.done ? today() : null; nowDone = item.done; }
  if (k === 'grocery') { item.got = !item.got; nowDone = item.got; }
  if (k === 'clean') { const d = cleanDone(item); item.prevDoneAt = d ? item.prevDoneAt : item.doneAt; item.doneAt = d ? (item.prevDoneAt || null) : today(); if (d) delete item.prevDoneAt; nowDone = !d; }
  if (nowDone) { confetti(btn); toast(k === 'grocery' ? 'In the cart 🛒' : cheer()); }
  save(k); render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-set],[data-seg]');
  if (!t) { if (e.target === sheetWrap) closeSheet(); return; }
  if (t.dataset.set) {
    UI[t.dataset.set] = t.dataset.v; render(); return;
  }
  if (t.dataset.seg) {
    const n = t.dataset.seg; UI[n] = t.dataset.v;
    t.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === t));
    if (n === 'mDir' && !UI.mCatTouched) { UI.mCat = t.dataset.v === 'in' ? 'income' : detectMoney(($('#mDesc') || {}).value || ''); const sel = $('#mCat'); if (sel) sel.value = UI.mCat; }
    return;
  }
  const a = t.dataset.act;
  if (a === 'toggle') return toggle(t.dataset.k, t.dataset.id, t);
  if (a === 'edit') return openEdit(t.dataset.k, t.dataset.id);
  if (a === 'sheet-close') return closeSheet();
  if (a === 'sheet-delete') { const { k, id } = sheetCtx; closeSheet(); return deleteItem(k, id); }
  if (a === 'clear-examples') { closeSheet(); return clearExamples(); }
  if (a === 'add-urgent') { UI.addUrgent = !UI.addUrgent; t.setAttribute('aria-pressed', UI.addUrgent); return; }
  if (a === 'one-thing') { const id = pickOne(); if (!id) { toast('Nothing on your list. Enjoy the calm 🌤️'); return; } UI.focus = id; render(); return; }
  if (a === 'focus-close') { UI.focus = null; render(); return; }
  if (a === 'focus-done') { const it = S.tasks.items.find(x => x.id === UI.focus); if (it) { it.done = true; it.doneAt = today(); save('tasks'); } confetti(t); toast(cheer()); UI.focus = null; render(); return; }
  if (a === 'clear-done') {
    e.preventDefault(); const k = t.dataset.k;
    if (k === 'tasks') S.tasks.items = S.tasks.items.filter(x => !x.done); else S.grocery.items = S.grocery.items.filter(x => !x.got);
    save(k); render(); toast(k === 'tasks' ? 'Done list cleared' : 'Cart cleared'); return;
  }
  if (a === 'month') { const d = parseYmd(UI.month + '-01'); d.setMonth(d.getMonth() + Number(t.dataset.d)); UI.month = ymd(d).slice(0, 7); render(); return; }
  if (a === 'edit-start') {
    openSheet(`<h2 id="sheetTitle">Starting balance</h2><p>What was in your account before the first entry you logged here? Your balance is this plus everything in, minus everything out.</p>
      <form id="startForm" style="display:flex;flex-direction:column;gap:14px">${field('Starting balance ($)', 's_amt', `<input id="s_amt" type="number" step="0.01" inputmode="decimal" value="${S.money.start}">`)}
      <div class="sheet-actions"><span></span><div class="right"><button class="btn ghost" type="button" data-act="sheet-close">Cancel</button><button class="btn" type="submit">Save</button></div></div></form>`, { start: true }, 'b-money');
    return;
  }
  if (a === 'care-did') { const c = S.care.items.find(x => x.id === t.dataset.id); if (c) { c.log = [...new Set([...(c.log || []), today()])].sort().slice(-90); delete c.ex; save('care'); confetti(t); toast(cheer()); render(); } return; }
  if (a === 'care-undo') { const c = S.care.items.find(x => x.id === t.dataset.id); if (c) { c.log = (c.log || []).filter(d => d !== today()); save('care'); render(); } return; }
  if (a === 'care-idea') { const i = CARE_IDEAS.find(x => x.text === t.dataset.t); if (i) { S.care.items.push({ id: uid(), text: i.text, kind: i.kind, every: i.every, e: i.e, log: [] }); save('care'); render(); toast('Added 💖'); } return; }
  if (a === 'export') return exportData();
  if (a === 'wipe-ask') { $('#wipeConfirm').innerHTML = `<div class="examples" style="border-color:var(--hot)"><span><strong>Erase every list?</strong> This can't be undone. Download a backup first if you might want it.</span><button class="btn small danger" type="button" data-act="wipe">Yes, erase all</button></div>`; return; }
  if (a === 'wipe') { KEYS.forEach(k => { S[k] = BLANK[k](); save(k); }); UI.focus = null; closeSheet(); render(); toast('Everything erased'); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheetWrap.hidden) closeSheet(); });

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files && t.files[0]) return importData(t.files[0]);
  if (t.dataset.setSelect) { UI[t.dataset.setSelect] = t.value; render(); return; }
  if (t.id === 'taskCat') { UI.addCat = t.value; UI.addCatTouched = true; }
  if (t.id === 'groAisle') { UI.addAisle = t.value; UI.addAisleTouched = true; }
  if (t.id === 'groStore') UI.addStore = t.value;
  if (t.id === 'cleanRoom') { UI.addRoom = t.value; UI.addRoomTouched = true; }
  if (t.id === 'mCat') { UI.mCat = t.value; UI.mCatTouched = true; }
  if (t.id === 'careKind') UI.careKind = t.value;
  if (t.id === 'careEvery') UI.careEvery = Number(t.value);
});
document.addEventListener('input', e => {
  const t = e.target, v = t.value;
  if (t.id === 'taskInput' && !UI.addCatTouched) { UI.addCat = detectTask(v); $('#taskCat').value = UI.addCat; }
  if (t.id === 'groInput') {
    if (!UI.addAisleTouched) { UI.addAisle = detectAisle(v.split(',')[0]); $('#groAisle').value = UI.addAisle; }
    const st = detectStore(v); if (st) { UI.addStore = st; $('#groStore').value = st; }
  }
  if (t.id === 'cleanInput' && !UI.addRoomTouched) { UI.addRoom = detectRoom(v); $('#cleanRoom').value = UI.addRoom; }
  if (t.id === 'mDesc' && !UI.mCatTouched) { const c = detectMoney(v); UI.mCat = c; $('#mCat').value = c; if (c === 'income' && UI.mDir !== 'in') { UI.mDir = 'in'; document.querySelectorAll('[data-seg="mDir"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'in')); } }
});

document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'editForm') return saveEdit();
  if (f.id === 'startForm') { S.money.start = parseFloat($('#s_amt', sheet).value) || 0; save('money'); closeSheet(); render(); toast('Saved'); return; }
  const k = f.dataset.form;
  if (k === 'tasks') {
    const text = $('#taskInput').value.trim(); if (!text) return $('#taskInput').focus();
    S.tasks.items.unshift({ id: uid(), text, cat: UI.addCatTouched ? UI.addCat : detectTask(text), when: UI.addWhen, urgent: UI.addUrgent, done: false, addedOn: today() });
    UI.addCat = null; UI.addCatTouched = false; UI.addUrgent = false;
    if (UI.taskWhen !== 'all' && !inWhen({ when: UI.addWhen }, UI.taskWhen)) UI.taskWhen = UI.addWhen;
    save('tasks'); render(); $('#taskInput').focus(); toast('Added ✨');
  }
  if (k === 'grocery') {
    const parts = $('#groInput').value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    if (!parts.length) return $('#groInput').focus();
    parts.forEach((p, idx) => {
      const m = p.match(/^(\d+\s*[a-z]{0,3})\s+(.+)$/i) || p.match(/^(.+?)\s+x\s*(\d+)$/i);
      let text = p, qty = '';
      if (m) { if (/^\d/.test(m[1])) { qty = m[1].trim(); text = m[2]; } else { text = m[1]; qty = m[2]; } }
      text = text.replace(/\b(at|from)\s+(safeway|no frills|costco)\b/i, '').trim() || text;
      text = text.charAt(0).toUpperCase() + text.slice(1);
      const aisle = idx === 0 && UI.addAisleTouched ? UI.addAisle : detectAisle(text);
      S.grocery.items.push({ id: uid(), text, aisle, store: UI.addStore, qty, got: false });
    });
    UI.addAisle = null; UI.addAisleTouched = false;
    save('grocery'); render(); $('#groInput').focus(); toast(parts.length > 1 ? `Added ${parts.length} items 🛒` : 'Added 🛒');
  }
  if (k === 'clean') {
    const text = $('#cleanInput').value.trim(); if (!text) return $('#cleanInput').focus();
    S.clean.items.push({ id: uid(), text, room: UI.addRoomTouched ? UI.addRoom : detectRoom(text), freq: UI.addFreq, doneAt: null });
    UI.addRoom = null; UI.addRoomTouched = false;
    save('clean'); render(); $('#cleanInput').focus(); toast('Added 🧽');
  }
  if (k === 'money') {
    const desc = $('#mDesc').value.trim(); const amt = Math.abs(parseFloat($('#mAmt').value));
    if (!desc) return $('#mDesc').focus();
    if (!amt) return $('#mAmt').focus();
    const date = $('#mDate').value || today();
    S.money.entries.push({ id: uid(), date, desc, amount: Math.round(amt * 100) / 100, dir: UI.mDir, cat: UI.mCatTouched ? UI.mCat : (UI.mDir === 'in' && detectMoney(desc) === 'other' ? 'income' : detectMoney(desc)) });
    UI.mCat = null; UI.mCatTouched = false; UI.month = date.slice(0, 7);
    save('money'); render(); $('#mDesc').focus(); toast('Logged 💸');
  }
  if (k === 'care') {
    const text = $('#careInput').value.trim(); if (!text) return $('#careInput').focus();
    S.care.items.push({ id: uid(), text, kind: UI.careKind, every: UI.careEvery, log: [] });
    save('care'); render(); $('#careInput').focus(); toast('Added 💖');
  }
});

window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
render();
connect();
})();
</script>
